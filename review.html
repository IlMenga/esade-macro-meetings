:0; }\n    .program-note strong { font-weight:500; color:var(--navy); }\n    .secondary { color:var(--muted); font-size:14px; }\n    .program-detail { margin:7px 0 0; }\n    .venue-grid { display:grid; grid-template-columns:1fr 1fr; gap:38px; }\n    .venue-grid p { margin-bottom:10px; }\n    .committee { margin-bottom:10px; line-height:1.9; }\n    .committee a { white-space:nowrap; }\n    .keynotes a, .committee a { text-decoration:none; }\n    .keynotes a:hover, .committee a:hover { text-decoration:none;color:#405584; }\n    .contact-line { margin:22px 0 0; font-size:14px; }\n    .archive-teaser { display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:29px 0; }\n    .archive-teaser p { margin:0; font-size:14px; color:var(--muted); }\n    .archive-teaser a { font-size:14px; white-space:nowrap; }\n    footer { margin-top:20px; padding:31px 0; background:var(--wash); font-size:12px; color:var(--muted); }\n    .footer-inner { display:flex; justify-content:space-between; gap:35px; align-items:center; }\n    footer strong { color:var(--navy); font-weight:500; }\n    footer a { text-decoration:none; }\n    .archive-intro { max-width:710px; }\n    .archive-list { border-top:1px solid var(--line); }\n    .archive-row { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:40px; padding:35px 0; border-bottom:1px solid var(--line); }\n    .year { color:var(--navy); font:normal 36px/1.1 Georgia,'Times New Roman',serif; }\n    .archive-row h2 { font:normal 23px/1.4 Georgia,'Times New Roman',serif; margin-bottom:5px; }\n    .archive-row p { margin:0; font-size:14px; color:var(--muted); }\n    .archive-row a { font-size:14px; }\n    .archive-return { padding:35px 0 58px; font-size:14px; }\n    [hidden] { display:none!important; }\n    @media(max-width:950px) {\n      .container { width:calc(100% - 48px); }\n      .brand-description { display:none; }\n      .hero-grid { grid-template-columns:1fr 225px; gap:30px; }\n      .content-section { grid-template-columns:145px 1fr; gap:25px; }\n      .keynotes,.call-grid,.venue-grid { gap:24px; }\n      h3 { font-size:22px; }\n      .call-grid { grid-template-columns:1fr; }\n      .dates { padding:0; border:0; display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }\n      .dates dt:nth-of-type(1) { grid-column:1;grid-row:1; }\n      .dates dd:nth-of-type(1) { grid-column:1;grid-row:2; }\n      .dates dt:nth-of-type(2) { grid-column:2;grid-row:1; }\n      .dates dd:nth-of-type(2) { grid-column:2;grid-row:2; }\n    }\n    @media(max-width:640px) {\n      .container { width:calc(100% - 40px); }\n      .header-inner { flex-wrap:wrap; gap:12px; padding:20px 0 14px; }\n      .logo { width:110px; }\n      .committee { display:flex; flex-direction:column; align-items:flex-start; }\n      .committee span { display:none; }\n      .committee a, .keynotes h3 a { display:inline-flex; align-items:center; min-height:44px; }\n      .header-inner nav a, .section-nav a { display:inline-flex; align-items:center; min-height:44px; }\n      .section-nav { flex-wrap:wrap; }\n      nav { width:100%; margin:0; justify-content:space-between; gap:18px; font-size:13px; }\n      .hero { padding:38px 0 30px; }\n      h1 { font-size:39px; letter-spacing:-1px; }\n      .hero-grid { grid-template-columns:1fr; gap:23px; }\n      .lead { font-size:16px; }\n      .event-facts { border:0; padding:0; }\n      .event-facts strong { font-size:23px; }\n      .section-nav { gap:0; justify-content:space-between; font-size:12px; }\n      .content-section { grid-template-columns:1fr; gap:20px; padding:30px 0; }\n      .keynotes,.venue-grid { grid-template-columns:1fr; gap:23px; }\n      h3 { font-size:24px; }\n      .archive-teaser,.footer-inner { align-items:flex-start; flex-direction:column; gap:12px; }\n      .archive-row { grid-template-columns:70px 1fr; gap:20px; padding:27px 0; }\n      .archive-row>a { grid-column:2; }\n      .archive-row h2 { font-size:20px; }\n      .year { font-size:30px; }\n    }\n    @media(prefers-reduced-motion:reduce) { html {scroll-behavior:auto;} }\n  .stage-note{font-size:14px;color:var(--muted);margin:16px 0 0}.sample-note{border-left:2px solid #a7adbe;padding:10px 16px;background:var(--wash)}#program .content-section{display:block;padding:16px 0}#program .content-section h2{margin-bottom:8px}.preview-strip{background:#f6f7f9;padding:6px 16px;text-align:center;color:#505767;font-size:12px}.preview-strip a{color:inherit}\u003c/style>\n\u003cmeta name=\"referrer\" content=\"no-referrer\">\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"masthead\">\n    \u003cdiv class=\"container header-inner\">\n      \u003ca href=\"#home\" aria-label=\"Esade Macro Meetings home\">\u003cimg class=\"logo\" src=\"assets/esade.png\" alt=\"Esade, Ramon Llull University\">\u003c/a>\n      \u003cdiv class=\"brand-description\">\u003cstrong>Esade Macro Meetings\u003c/strong>\u003cbr>Group Research in Economics and Finance\u003c/div>\n      \u003cnav aria-label=\"Main navigation\">\n        \u003ca href=\"#home\" data-nav=\"home\" aria-current=\"page\">Current edition\u003c/a>\n        \u003ca href=\"#archive\" data-nav=\"archive\">Previous editions\u003c/a>\n        \u003ca href=\"#contact\">Contact\u003c/a>\n      \u003c/nav>\n    \u003c/div>\n  \u003c/header>\n  \u003cspan id=\"home\">\u003c/span>\u003cmain id=\"home-view\" class=\"container\">\n    \u003cdiv class=\"hero\">\n      \u003cp class=\"eyebrow\">Fourth edition \u00b7 2027\u003c/p>\n      \u003ch1>Esade Macro Meetings\u003c/h1>\n      \u003cdiv class=\"hero-grid\">\n        \u003cdiv>\n          \u003cp class=\"lead\">A workshop bringing together researchers in macroeconomics for two days of presentations and discussion at Esade Business School.\u003c/p>\n          \u003cdiv class=\"actions\">\n            \u003ca class=\"button\" href=\"https://form.jotform.com/262852008329054\" target=\"_blank\" rel=\"noopener\">Submit a paper \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\n            \u003ca href=\"assets/call-for-papers-2027.pdf\" target=\"_blank\" rel=\"noopener\">Call for papers \u003cspan class=\"secondary\">(PDF)\u003c/span>\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"event-facts\">\u003cstrong>May 24\u201325, 2027\u003c/strong>\u003cspan>Barcelona, Spain\u003c/span>\u003cspan>Esade \u00b7 Pedralbes Campus\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cnav class=\"section-nav\" aria-label=\"2027 edition sections\">\n      \u003ca href=\"#keynotes\">Keynote speakers\u003c/a>\u003ca href=\"#submissions\">Submissions\u003c/a>\u003ca href=\"#program\">Program\u003c/a>\u003ca href=\"#venue\">Venue\u003c/a>\n    \u003c/nav>\n    \u003csection class=\"content-section\" id=\"keynotes\">\n      \u003ch2>Keynote speakers\u003c/h2>\n      \u003cdiv class=\"keynotes\">\n        \u003cdiv>\u003ch3>\u003ca href=\"https://silviamirandaagrippino.com/\">Silvia Miranda-Agrippino\u003c/a>\u003c/h3>\u003cp>University of Oxford\u003c/p>\u003c/div>\n        \u003cdiv>\u003ch3>\u003ca href=\"https://www.simonmongey.com/\">Simon Mongey\u003c/a>\u003c/h3>\u003cp>Federal Reserve Bank of Minneapolis\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"content-section\" id=\"submissions\">\n      \u003ch2>Call for papers\u003c/h2>\n      \u003cdiv class=\"call-grid\">\n        \u003cdiv>\u003cp>We welcome theoretical and empirical papers from all fields of macroeconomics. The workshop provides an informal and highly interactive environment for presenting and discussing research.\u003c/p>\u003cp>Please submit your paper in PDF format through the submission form.\u003c/p>\u003ca class=\"small-link\" href=\"https://form.jotform.com/262852008329054\" target=\"_blank\" rel=\"noopener\">Submit your paper \u2197\u003c/a> &nbsp;\u00b7&nbsp; \u003ca class=\"small-link\" href=\"assets/call-for-papers-2027.pdf\" target=\"_blank\" rel=\"noopener\">Download the call (PDF)\u003c/a>\u003c/div>\n        \u003cdl class=\"dates\">\u003cdt>Submission deadline\u003c/dt>\u003cdd>February 14, 2027\u003c/dd>\u003cdt>Acceptance notification\u003c/dt>\u003cdd>March 1, 2027\u003c/dd>\u003c/dl>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"content-section\" id=\"program\">\n      \u003ch2>Program\u003c/h2>\n      \u003cdiv>\u003cp class=\"program-note\">\u003cstrong>The program will be available in March 2027.\u003c/strong>\u003c/p>\u003cp class=\"secondary program-detail\">The session schedule and a downloadable PDF will appear here.\u003c/p>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"content-section\" id=\"venue\">\n      \u003ch2>Venue\u003c/h2>\n      \u003cdiv class=\"venue-grid\">\u003cdiv>\u003cp>Esade Business School\u003cbr>Pedralbes Campus \u00b7 Barcelona\u003c/p>\u003cp class=\"secondary\">Room details and travel directions will be added closer to the workshop.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"secondary\">The workshop will be held in person on May 24 and 25, 2027.\u003c/p>\u003c/div>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"content-section\" id=\"contact\">\n      \u003ch2>Organisers &amp; contact\u003c/h2>\n      \u003cdiv>\u003cp class=\"secondary\" style=\"margin-bottom:5px\">Scientific committee\u003c/p>\u003cp class=\"committee\">\u003ca href=\"https://sites.google.com/site/calinarcalean/\">Calin Arcalean\u003c/a>\u003cspan aria-hidden=\"true\"> \u00b7 \u003c/span>\u003ca href=\"https://paolomengano.com/\">Paolo Mengano\u003c/a>\u003cspan aria-hidden=\"true\"> \u00b7 \u003c/span>\u003ca href=\"https://sites.google.com/site/ioanaschiopuweb/\">Ioana Schiopu\u003c/a>\u003cspan aria-hidden=\"true\"> \u00b7 \u003c/span>\u003ca href=\"https://sites.google.com/site/carolinavillegassanchez/\">Carolina Villegas Sanchez\u003c/a>\u003c/p>\u003cp class=\"secondary\" style=\"margin-bottom:0\">Group Research in Economics and Finance (GREF)\u003cbr>Esade Business School\u003c/p>\u003cp class=\"contact-line\">For enquiries: \u003ca href=\"mailto:em2@esade.edu\">em2@esade.edu\u003c/a>\u003c/p>\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"archive-teaser\">\u003cp>Explore the workshop\u2019s past editions and programs.\u003c/p>\u003ca href=\"#archive\">Previous editions \u2192\u003c/a>\u003c/div>\n  \u003c/main>\n  \u003cspan id=\"archive\">\u003c/span>\u003cmain id=\"archive-view\" class=\"container\" hidden>\n    \u003cdiv class=\"hero\">\u003cp class=\"eyebrow\">Esade Macro Meetings\u003c/p>\u003ch1>Previous editions\u003c/h1>\u003cp class=\"lead archive-intro\">The workshop has brought researchers together at Esade in Barcelona since 2024. Browse the programs from past editions below.\u003c/p>\u003c/div>\n    \u003cdiv class=\"archive-list\">\n      \u003carticle class=\"archive-row\">\u003cdiv class=\"year\">2026\u003c/div>\u003cdiv>\u003ch2>Third edition\u003c/h2>\u003cp>May 14\u201315, 2026 \u00b7 Barcelona\u003c/p>\u003cp>Esade Business School \u00b7 Pedralbes Campus\u003c/p>\u003c/div>\u003ca href=\"assets/program-2026.pdf\" target=\"_blank\" rel=\"noopener\">View program \u003cspan class=\"secondary\">(PDF)\u003c/span> \u2197\u003c/a>\u003c/article>\n      \u003carticle class=\"archive-row\">\u003cdiv class=\"year\">2025\u003c/div>\u003cdiv>\u003ch2>Second edition\u003c/h2>\u003cp>May 15\u201316, 2025 \u00b7 Barcelona\u003c/p>\u003cp>Keynote speaker: Vincent Sterk\u003c/p>\u003c/div>\u003ca href=\"assets/program-2025.pdf\" target=\"_blank\" rel=\"noopener\">View program \u003cspan class=\"secondary\">(PDF)\u003c/span> \u2197\u003c/a>\u003c/article>\n      \u003carticle class=\"archive-row\">\u003cdiv class=\"year\">2024\u003c/div>\u003cdiv>\u003ch2>First edition\u003c/h2>\u003cp>May 16\u201317, 2024 \u00b7 Barcelona\u003c/p>\u003cp>Keynote speaker: Nir Jaimovich\u003c/p>\u003c/div>\u003ca href=\"assets/program-2024.pdf\" target=\"_blank\" rel=\"noopener\">View program \u003cspan class=\"secondary\">(PDF)\u003c/span> \u2197\u003c/a>\u003c/article>\n    \u003c/div>\n    \u003cdiv class=\"archive-return\">\u003ca href=\"#home\">\u2190 Current edition: May 24\u201325, 2027\u003c/a>\u003c/div>\n  \u003c/main>\n  \u003cfooter>\u003cdiv class=\"container footer-inner\">\u003cdiv>\u003cstrong>Esade Macro Meetings\u003c/strong>\u003cbr>Group Research in Economics and Finance \u00b7 Esade Business School\u003c/div>\u003ca href=\"mailto:em2@esade.edu\">em2@esade.edu\u003c/a>\u003c/div>\u003c/footer>\n  \u003cscript>\n    const stages=['open','closed','program','attending','past'];\n    const stage=stages.includes(document.documentElement.dataset.stage)?document.documentElement.dataset.stage:'open';\n    const hasProgram=['program','attending','past'].includes(stage);\n    const actions=document.querySelector('.actions'), nav=document.querySelector('.header-inner nav');\n    const A=(path,label,cls='')=>'\u003ca class=\"'+cls+'\" href=\"#'+path+'\">'+label+'\u003c/a>';\n    const pdf='\u003ca href=\"assets/call-for-papers-2027.pdf\" target=\"_blank\" rel=\"noopener\">Call for papers (PDF)\u003c/a>';\n    const submit='\u003ca class=\"button\" href=\"https://form.jotform.com/262852008329054\" target=\"_blank\" rel=\"noopener\">Submit a paper \u2197\u003c/a>';\n    const notice={open:'Submission deadline: February 14, 2027.',closed:'Submissions are closed. Acceptance notification: March 1, 2027. The program will be available later in March.',program:'Workshop program \u00b7 May 24\u201325, 2027',attending:'Attending in Barcelona \u00b7 May 24\u201325, 2027',past:'This edition took place on May 24\u201325, 2027.'};\n    actions.innerHTML=({open:submit+A('submissions','Call for papers'),closed:A('keynotes','Meet the keynote speakers')+A('venue','Venue'),program:A('program','View the program \u2192','button')+A('venue','Venue'),attending:A('program','View the program \u2192','button')+A('venue','Plan your visit \u2192'),past:A('record','Explore the 2027 edition \u2192','button')+A('archive','Previous editions')})[stage];\n    actions.insertAdjacentHTML('afterend','\u003cp class=\"stage-note\">'+notice[stage]+'\u003c/p>');\n    if(stage==='past'){\n      document.querySelector('.archive-list').insertAdjacentHTML('afterbegin','\u003carticle class=\"archive-row\">\u003cdiv class=\"year\">2027\u003c/div>\u003cdiv>\u003ch2>Fourth edition\u003c/h2>\u003cp>May 24\u201325, 2027 \u00b7 Barcelona\u003c/p>\u003cp>Silvia Miranda-Agrippino and Simon Mongey\u003c/p>\u003c/div>'+A('record','Edition record \u2192')+'\u003c/article>');\n      document.querySelector('.archive-return').innerHTML=A('home','\u2190 2027 edition');\n    }\n    const program='\u003cp class=\"sample-note\">Design preview: the 2027 schedule will be released in March. No session times or speaker assignments are confirmed here.\u003c/p>\u003cdiv class=\"content-section\">\u003ch2>Monday, May 24\u003c/h2>\u003cdiv>\u003ch3>Day one\u003c/h3>\u003cp>Session times, speakers and paper titles will appear here.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"content-section\">\u003ch2>Tuesday, May 25\u003c/h2>\u003cdiv>\u003ch3>Day two\u003c/h3>\u003cp>Session times, speakers and paper titles will appear here.\u003c/p>\u003c/div>\u003c/div>';\n    const main=document.querySelector('#home-view'), jump=main.querySelector('.section-nav');\n    const sections=Object.fromEntries([...main.querySelectorAll('section[id]')].map(s=>[s.id,s]));\n    const order={\n      open:['keynotes','submissions','program','venue','contact'],\n      closed:['keynotes','program','venue','contact'],\n      program:['program','keynotes','venue','contact'],\n      attending:['venue','program','keynotes','contact'],\n      past:['program','keynotes','venue','contact']\n    }[stage];\n    if(hasProgram)sections.program.lastElementChild.innerHTML=program;\n    if(stage!=='open')sections.submissions.remove();\n    if(stage==='past'){\n      actions.innerHTML=A('program','View the 2027 program \u2192','button')+A('archive','Previous editions');\n      sections.program.lastElementChild.insertAdjacentHTML('beforeend','\u003cp>Edition record \u00b7 '+pdf+'\u003c/p>');\n      const record=document.querySelector('.archive-row a[href=\"#record\"]');if(record)record.href='#home';\n      nav.querySelector('a[href=\"#home\"]').textContent='2027 edition';\n    }\n    jump.innerHTML=order.filter(id=>id!=='contact').map(id=>A(id,({keynotes:'Keynote speakers',submissions:'Submissions',program:'Program',venue:'Venue'})[id])).join('');\n    const end=main.querySelector('.archive-teaser');order.forEach(id=>main.insertBefore(sections[id],end));\n    function showPage(route){\n      const archive=route==='archive';main.hidden=archive;document.querySelector('#archive-view').hidden=!archive;\n      nav.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+(archive?'archive':route==='contact'?'contact':'home'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});\n      document.title=(archive?'Previous editions':'2027 edition')+' \u00b7 Esade Macro Meetings';\n      const el=order.includes(route)&&document.getElementById(route);\n      if(el)requestAnimationFrame(()=>el.scrollIntoView());else window.scrollTo({top:0,behavior:'instant'});\n    }\n    if(window!==window.parent)document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const dest=a.getAttribute('href');if(dest?.startsWith('#')){e.preventDefault();showPage(dest.slice(1));}else if(a.protocol==='https:'){a.target='_blank';a.rel='noopener';}});\n    window.addEventListener('hashchange',()=>showPage(location.hash.slice(1)));showPage(location.hash.slice(1));\n  \u003c/script>\n\u003c/body>\u003c/html>";
const stage=document.querySelector('#stage'), views=document.querySelector('.views'), panels=[...document.querySelectorAll('.panel')],modes=['desktop','iphone','both'];
const param=new URLSearchParams(location.search);if([...stage.options].some(o=>o.value===param.get('stage')))stage.value=param.get('stage');let mode=modes.includes(param.get('device'))?param.get('device'):'iphone';
function fit(){for(const panel of panels){if(panel.hidden)continue;const outer=panel.querySelector('.port'),inner=panel.querySelector('.scale'),ratio=Math.min(1,panel.clientWidth/inner.offsetWidth);outer.style.width=inner.offsetWidth*ratio+'px';outer.style.height=inner.offsetHeight*ratio+'px';inner.style.transform='scale('+ratio+')';}}
function device(){views.classList.toggle('both',mode==='both');panels[0].hidden=mode==='iphone';panels[1].hidden=mode==='desktop';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));requestAnimationFrame(fit);}
function render(){for(const iframe of document.querySelectorAll('iframe')){iframe.srcdoc=template.replace('<html lang="en">','<html lang="en" data-stage="'+stage.value+'">');}device();}
stage.onchange=render;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;device()});new ResizeObserver(fit).observe(views);window.addEventListener('resize',fit);render();
</script></body></html>
